# Для WebSocket: если клиент просит «Upgrade», передаём это бэкенду.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Не показываем версию nginx в ответах и на страницах ошибок.
    server_tokens off;
    # Как у бэкенда: 6 МБ хватает на аватар.
    client_max_body_size 6m;

    root /usr/share/nginx/html;

    location = / {
        return 302 /Famigo/;
    }

    # API — на бэкенд. X-Forwarded-For перезаписываем адресом клиента, а не дописываем:
    # иначе клиент подставил бы туда любой IP и обошёл ограничение запросов.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Сервер пингует WebSocket каждые 25 секунд, так что живое соединение не оборвётся.
        proxy_read_timeout 60s;
    }

    # Файлы с хешем в имени никогда не меняются — кэшируем надолго.
    location /Famigo/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Одностраничное приложение: любой адрес внутри /Famigo/ отдаёт index.html,
    # а дальше маршрут разбирает React Router (в том числе страницу «не найдено»).
    location /Famigo/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /Famigo/index.html;
    }
}
