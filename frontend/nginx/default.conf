# Для WebSocket: если клиент просит «Upgrade», передаём это бэкенду.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Не показываем версию nginx в ответах и на страницах ошибок.
    server_tokens off;
    # Альбом чата: до 100 МБ файлов плюс служебные части multipart.
    client_max_body_size 101m;

    root /usr/share/nginx/html;
    absolute_redirect off;

    # Сохраняем старые ссылки после переноса сайта в корень домена.
    location = /Famigo {
        return 308 /$is_args$args;
    }
    location ~ ^/Famigo/(.*)$ {
        return 308 /$1$is_args$args;
    }

    # API — на бэкенд. X-Forwarded-For перезаписываем адресом клиента, а не дописываем:
    # иначе клиент подставил бы туда любой IP и обошёл ограничение запросов.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Сервер пингует WebSocket каждые 25 секунд, так что живое соединение не оборвётся.
        proxy_read_timeout 60s;
    }

    # Подбор блюд нейросетью: локальная модель думает до нескольких минут,
    # поэтому ждём ответа дольше, чем обычно (сервер сам обрывает через AI_TIMEOUT).
    location ~ ^/api/families/[^/]+/homes/[^/]+/recipes/suggest$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
    }

    # Файлы с хешем в имени никогда не меняются — кэшируем надолго.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Одностраничное приложение: клиентские маршруты отдают index.html,
    # а дальше маршрут разбирает React Router (в том числе страницу «не найдено»).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
