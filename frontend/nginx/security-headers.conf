# Заголовки безопасности для страниц фронтенда.
# Вынесены в отдельный файл: в nginx add_header внутри location отменяет заголовки уровнем выше,
# поэтому этот файл подключается в каждый location со статикой.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Камера — для сканирования QR чека, геолокация — для карты. Остальное запрещено.
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=()" always;

# CSP — главная защита от XSS: браузер выполнит только скрипты с нашего сайта
# и один встроенный скрипт темы (по его хешу). Если поменять этот скрипт в index.html,
# хеш нужно пересчитать, иначе тема будет применяться с небольшой задержкой.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-CNky6tllfJYyG03x8VFn3u/7M0ze4I0sBqL2H2YnCUs='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
