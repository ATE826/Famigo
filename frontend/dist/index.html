    <meta name="theme-color" content="#F5F3EE" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet" />
    <title>Famigo - семейная экосистема</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("famigo-theme");
          var dark =
            saved === "dark" ||
            (saved === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#151713" : "#F5F3EE");
        } catch (e) {}
      })();
    </script>
