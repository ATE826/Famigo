# Famigo целиком одной командой:
#
#   docker compose --env-file .env --env-file secrets.env up --build
#
# Обычные настройки лежат в .env (в репозитории), пароли и ключи — в secrets.env
# (в репозиторий не попадает). secrets.env можно хранить вне папки проекта,
# тогда укажите путь к нему: --env-file C:\secrets\famigo\secrets.env
# Без secrets.env (`docker compose up --build`) всё запустится с паролями для разработки.
#
# Затем откройте http://localhost:8080 — фронтенд, API (/api) и база.
# Остановить: Ctrl+C или `docker compose down` (данные останутся в томах).

name: famigo

services:
  # Ollama доступна только внутри сети Compose. Модели сохраняются между запусками.
  ollama:
    image: ollama/ollama:latest
    gpus: all
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      # Место для пяти рецептов, списка продуктов и ограничений в одном запросе.
      OLLAMA_CONTEXT_LENGTH: 16384
    volumes:
      - famigo-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # При первом старте скачивает модель; установленную модель повторно не скачивает.
  # Работает параллельно с сайтом: загрузка модели не задерживает бэкенд и фронтенд.
  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${AI_MODEL:-gemma4:e4b}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1; then
          echo "Model $$OLLAMA_MODEL is already installed"
        else
          exec ollama pull "$$OLLAMA_MODEL"
        fi
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # PostgreSQL доступен контейнерам и локальному pgAdmin на этом компьютере.
  # Привязка к 127.0.0.1 исключает публикацию порта на сетевых интерфейсах.
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: famigo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-famigo}
      POSTGRES_DB: famigo
    volumes:
      - famigo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U famigo -d famigo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - path: ./secrets.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      # SMTP_PASSWORD читается из env_file выше. Не перекрываем его пустым
      # значением при обычном `docker compose up` без --env-file secrets.env.
      # При спецсимволах в пароле используйте DOCKER_DATABASE_URL с URL-кодированием.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://famigo:${POSTGRES_PASSWORD:-famigo}@db:5432/famigo?sslmode=disable}
      # Пусто в разработке — сервер сгенерирует временный секрет. Для production обязателен.
      JWT_SECRET: ${JWT_SECRET:-}
      # Ключ шифрования сообщений в базе (формат 1:<base64>). В production обязателен.
      MESSAGE_KEYS: ${MESSAGE_KEYS:-}
      ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
      # Доверяем X-Forwarded-For только от nginx внутри этой сети.
      TRUSTED_PROXIES: 10.88.0.0/24
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RATE_LIMIT: ${RATE_LIMIT:-600}
      DEMO_PAYMENTS: ${DEMO_PAYMENTS:-true}
      UPLOAD_DIR: /app/uploads
      # Нейросеть для подбора блюд (см. .env). Ключ облачного провайдера — в secrets.env.
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_REASONING: ${AI_REASONING:-}
      AI_JSON_MODE: ${AI_JSON_MODE:-schema}
      AI_TIMEOUT: ${AI_TIMEOUT:-5m}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-1}
    # host.docker.internal — адрес компьютера из контейнера (на Linux его нужно объявить явно).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - famigo-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  famigo-db:
  famigo-uploads:
  famigo-ollama:

networks:
  default:
    ipam:
      config:
        - subnet: 10.88.0.0/24
